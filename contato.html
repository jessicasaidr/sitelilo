<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato - LiloPlay</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fffbf3">
  <meta name="apple-mobile-web-app-title" content="LiloPlay">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contato">
  <div id="header"></div>

  <main class="container">
    <div class="breadcrumb"><a href="index.html">Início</a> › Contato</div>
    <h1 class="page-title">Contato</h1>

    <div class="contact">
      <div>
        <p style="color:var(--ink-soft);margin-top:0">Ficou com alguma dúvida, quer um produto personalizado ou criar um projeto especial? Fale com a gente! ♡</p>
        <div class="contact-list" id="contactList"></div>
      </div>

      <form class="card-box" id="contactForm">
        <div class="field"><label for="cNome">Nome</label><input id="cNome" required placeholder="ex.: Maria Pérez"></div>
        <div class="field"><label for="cEmail">E-mail</label><input id="cEmail" type="email" required placeholder="ex.: seuemail@email.com.br"></div>
        <div class="field"><label for="cTel">Telefone</label><input id="cTel" type="tel" placeholder="ex.: (11) 97192-3030"></div>
        <div class="field"><label for="cMsg">Mensagem</label><textarea id="cMsg" required placeholder="ex.: Sua mensagem"></textarea></div>
        <button class="btn btn-primary btn-block" type="submit">Enviar</button>
        <div class="form-msg" id="contactMsg">Mensagem enviada! Responderemos em breve. ♡</div>
      </form>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script>
    Pages.contato = () => {
      $("#contactList").innerHTML = [
        ["wa", "green", "WhatsApp", STORE.whatsappLabel, `https://wa.me/${STORE.whatsapp}`],
        ["tel", "blue", "Telefone", STORE.phone, null],   /* só o WhatsApp é clicável */
        ["mail", "purple", "E-mail", STORE.email, null],
        ["pin", "orange", "Endereço", STORE.address, null],
      ].map(([i, c, t, v, href]) => `
        <${href ? `a href="${href}" target="_blank" rel="noopener"` : "div"} class="contact-item p-${c}">
          <span class="ic">${icon(i)}</span>
          <span><strong>${t}</strong><span style="color:var(--ink)">${v}</span></span>
        </${href ? "a" : "div"}>`).join("");

      /* Preenche nome/e-mail/telefone se o cliente estiver logado */
      if (DB.user) {
        const pr = DB.profile || {};
        $("#cNome").value = pr.nome || "";
        $("#cEmail").value = pr.email || DB.user.email || "";
        $("#cTel").value = pr.telefone || "";
      }

      const out = $("#contactMsg");
      const show = (html, ok) => {
        out.innerHTML = html;
        out.classList.add("show");
        out.style.background = ok ? "" : "var(--rose-1)";
        out.style.color = ok ? "" : "#be123c";
      };

      $("#contactForm").onsubmit = async (e) => {
        e.preventDefault();
        if (!DB.enabled) return show("O envio está indisponível no momento. Fale com a gente pelo WhatsApp.", false);
        const btn = $("button[type=submit]", e.target);
        btn.disabled = true; btn.style.opacity = .6;
        const { error } = await DB.client.from("contact_messages").insert({
          nome: $("#cNome").value.trim(),
          email: $("#cEmail").value.trim().toLowerCase(),
          telefone: $("#cTel").value.trim() || null,
          mensagem: $("#cMsg").value.trim(),
        });
        btn.disabled = false; btn.style.opacity = 1;
        if (error) {
          console.warn("Contato:", error);
          return show(error.code === "23514" ? "Confira os dados digitados (e-mail válido e mensagem de até 5000 caracteres)." : "Não foi possível enviar. Tente novamente.", false);
        }
        $("#cMsg").value = "";
        if (!DB.user) e.target.reset();
        show("Mensagem enviada! Responderemos em breve. ♡", true);
      };
    };
  </script>
</body>
</html>
